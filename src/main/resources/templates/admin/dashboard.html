<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard | EcoNest</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><div th:replace="~{fragments/layout :: header}"></div>
<main class="section"><div class="container"><div th:replace="~{fragments/layout :: alerts}"></div><p class="section-subtitle">Store management</p><h1 class="section-title">Admin dashboard</h1>
    <nav class="admin-nav"><a th:href="@{/admin}">Overview</a><a th:href="@{/admin/products}">Products</a><a th:href="@{/admin/categories}">Categories</a><a th:href="@{/admin/orders}">Orders</a></nav>
    <div class="stats-grid"><article class="stat-card"><span>Products</span><strong th:text="${stats.totalProducts}">0</strong></article><article class="stat-card"><span>Low stock</span><strong th:text="${stats.lowStockProducts}">0</strong></article><article class="stat-card"><span>Out of stock</span><strong th:text="${stats.outOfStockProducts}">0</strong></article><article class="stat-card"><span>Orders</span><strong th:text="${stats.totalOrders}">0</strong></article><article class="stat-card"><span>Customers</span><strong th:text="${stats.totalCustomers}">0</strong></article><article class="stat-card"><span>Revenue</span><strong th:text="${'$' + #numbers.formatDecimal(stats.totalRevenue, 1, 2)}">$0.00</strong></article></div>
    <div class="form-grid-2" style="margin-top:2rem"><section class="form-card"><h2>Recent orders</h2><p th:if="${#lists.isEmpty(recentOrders)}">No orders yet.</p><div class="table-responsive" th:if="${not #lists.isEmpty(recentOrders)}"><table class="data-table"><thead><tr><th>Reference</th><th>Customer</th><th>Status</th><th>Total</th></tr></thead><tbody><tr th:each="order : ${recentOrders}"><td><a th:href="@{/admin/orders/{id}(id=${order.id})}" th:text="${order.orderReference}">Order</a></td><td th:text="${order.customerName}">Customer</td><td th:text="${order.status.displayName}">Status</td><td th:text="${'$' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</td></tr></tbody></table></div></section><section class="form-card"><h2>Low-stock alerts</h2><p th:if="${#lists.isEmpty(lowStockAlerts)}">No products need restocking.</p><ul><li th:each="product : ${lowStockAlerts}"><a th:href="@{/admin/products/{id}/edit(id=${product.id})}" th:text="${product.name}">Product</a> — <span th:text="${product.stockQuantity}">0</span> remaining</li></ul></section></div>
</div></main><div th:replace="~{fragments/layout :: footer}"></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
