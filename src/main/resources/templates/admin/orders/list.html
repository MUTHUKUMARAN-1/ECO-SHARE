<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage orders | EcoNest</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><div th:replace="~{fragments/layout :: header}"></div><main class="section"><div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div><p class="section-subtitle"><a th:href="@{/admin}">Admin</a> / Orders</p><h1 class="section-title">Orders</h1>
    <form class="form-card" th:action="@{/admin/orders}" method="get" style="margin:1.5rem 0"><label for="status">Filter status</label><select class="form-control" id="status" name="status" style="max-width:300px"><option value="">All statuses</option><option th:each="status : ${allStatuses}" th:value="${status}" th:selected="${selectedStatus == status}" th:text="${status.displayName}">Status</option></select><button class="btn btn-secondary btn-sm" type="submit" style="margin-top:.75rem">Filter</button></form>
    <div class="table-responsive form-card"><table class="data-table"><thead><tr><th>Reference</th><th>Customer</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${order.orderReference}">Order</td><td th:text="${order.customerName}">Customer</td><td th:text="${#temporals.format(order.createdAt, 'MMM d, yyyy')}">Date</td><td th:text="${order.status.displayName}">Status</td><td th:text="${'$' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</td><td><a th:href="@{/admin/orders/{id}(id=${order.id})}">Details</a></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="6">No orders found.</td></tr></tbody></table></div>
    <nav class="pagination" th:if="${totalPages > 1}"><a th:if="${currentPage > 0}" th:href="@{/admin/orders(page=${currentPage - 1},status=${selectedStatus})}">Previous</a><span th:text="${'Page ' + (currentPage + 1) + ' of ' + totalPages}"></span><a th:if="${currentPage + 1 < totalPages}" th:href="@{/admin/orders(page=${currentPage + 1},status=${selectedStatus})}">Next</a></nav>
</div></main><div th:replace="~{fragments/layout :: footer}"></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
