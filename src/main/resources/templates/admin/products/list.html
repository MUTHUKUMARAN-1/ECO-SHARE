<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage products | EcoNest</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><div th:replace="~{fragments/layout :: header}"></div><main class="section"><div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div><p class="section-subtitle"><a th:href="@{/admin}">Admin</a> / Products</p><h1 class="section-title">Products</h1><a class="btn btn-primary" th:href="@{/admin/products/new}">Add product</a>
    <form class="form-card" th:action="@{/admin/products}" method="get" style="margin:1.5rem 0"><div class="form-grid-2"><input class="form-control" name="keyword" placeholder="Search products" th:value="${keyword}"><select class="form-control" name="category"><option value="">All categories</option><option th:each="category : ${categories}" th:value="${category.id}" th:selected="${categoryId == category.id}" th:text="${category.name}">Category</option></select></div><button class="btn btn-secondary btn-sm" type="submit" style="margin-top:.75rem">Search</button></form>
    <div class="table-responsive form-card"><table class="data-table"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="product : ${products}"><td th:text="${product.name}">Product</td><td th:text="${product.sku}">SKU</td><td th:text="${product.category.name}">Category</td><td th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$0.00</td><td><form th:action="@{/admin/products/{id}/stock(id=${product.id})}" method="post" style="display:flex;gap:.4rem"><input class="form-control" style="width:80px" type="number" min="0" name="stockQuantity" th:value="${product.stockQuantity}"><button class="btn btn-secondary btn-sm" type="submit">Save</button></form></td><td th:text="${product.active ? 'Active' : 'Inactive'}">Active</td><td><a th:href="@{/admin/products/{id}/edit(id=${product.id})}">Edit</a><form th:action="@{/admin/products/{id}/toggle(id=${product.id})}" method="post" style="display:inline"><button class="btn btn-secondary btn-sm" type="submit">Toggle</button></form><form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" style="display:inline"><button class="btn btn-danger btn-sm" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="7">No products found.</td></tr></tbody></table></div>
    <nav class="pagination" th:if="${totalPages > 1}"><a th:if="${currentPage > 0}" th:href="@{/admin/products(page=${currentPage - 1},keyword=${keyword},category=${categoryId})}">Previous</a><span th:text="${'Page ' + (currentPage + 1) + ' of ' + totalPages}"></span><a th:if="${currentPage + 1 < totalPages}" th:href="@{/admin/products(page=${currentPage + 1},keyword=${keyword},category=${categoryId})}">Next</a></nav>
</div></main><div th:replace="~{fragments/layout :: footer}"></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
