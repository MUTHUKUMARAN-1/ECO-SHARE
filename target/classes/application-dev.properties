# ===================================================================
# EcoNest E-Commerce Configuration
# Development Profile (H2 In-Memory with MySQL Mode for Instant Run)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:econest_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# schema.sql contains MySQL-specific database setup; Hibernate creates the H2 schema.
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.thymeleaf.cache=false
logging.level.com.econest=DEBUG
