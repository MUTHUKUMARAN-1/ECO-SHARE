<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage categories | EcoNest</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><div th:replace="~{fragments/layout :: header}"></div><main class="section"><div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div><p class="section-subtitle"><a th:href="@{/admin}">Admin</a> / Categories</p><h1 class="section-title">Categories</h1><a class="btn btn-primary" th:href="@{/admin/categories/new}">Add category</a>
    <div class="table-responsive form-card" style="margin-top:1.5rem"><table class="data-table"><thead><tr><th>Name</th><th>Products</th><th>Display order</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="category : ${categories}"><td th:text="${category.name}">Category</td><td th:text="${productCounts[category.id]}">0</td><td th:text="${category.displayOrder}">0</td><td th:text="${category.active ? 'Active' : 'Inactive'}">Active</td><td><a th:href="@{/admin/categories/{id}/edit(id=${category.id})}">Edit</a><form th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post" style="display:inline"><button class="btn btn-danger btn-sm" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(categories)}"><td colspan="5">No categories found.</td></tr></tbody></table></div>
</div></main><div th:replace="~{fragments/layout :: footer}"></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
