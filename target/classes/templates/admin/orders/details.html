<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order details | EcoNest</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><div th:replace="~{fragments/layout :: header}"></div><main class="section"><div class="container" style="max-width:900px">
    <div th:replace="~{fragments/layout :: alerts}"></div><p><a th:href="@{/admin/orders}">← Orders</a></p><h1 class="section-title" th:text="${'Order ' + order.orderReference}">Order details</h1>
    <div class="form-grid-2" style="align-items:start"><section class="form-card"><h2>Customer and delivery</h2><p th:text="${order.customerName}">Customer</p><p th:text="${order.customerEmail}">Email</p><p th:text="${order.customerPhone}">Phone</p><p th:text="${order.shippingAddress + ', ' + order.city + ', ' + order.state + ' ' + order.postalCode + ', ' + order.country}">Address</p><h2 style="margin-top:1rem">Items</h2><div class="summary-row" th:each="item : ${order.items}"><span th:text="${item.productName + ' × ' + item.quantity}">Item</span><strong th:text="${'$' + #numbers.formatDecimal(item.subtotal, 1, 2)}">$0.00</strong></div><div class="summary-row"><strong>Total</strong><strong th:text="${'$' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</strong></div></section>
    <form class="form-card" th:action="@{/admin/orders/{id}/status(id=${order.id})}" th:object="${statusForm}" method="post"><h2>Update order status</h2><p>Current: <strong th:text="${order.status.displayName}">Pending</strong></p><div class="form-group"><label for="status">New status</label><select class="form-control" id="status" th:field="*{status}"><option th:each="status : ${allStatuses}" th:value="${status}" th:text="${status.displayName}">Status</option></select></div><button class="btn btn-primary" type="submit">Update status</button></form></div>
</div></main><div th:replace="~{fragments/layout :: footer}"></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
