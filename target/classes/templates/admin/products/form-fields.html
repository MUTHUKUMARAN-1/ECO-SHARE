<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body><div th:fragment="fields">
    <div class="form-grid-2">
        <div class="form-group"><label for="sku">SKU</label><input class="form-control" id="sku" th:field="*{sku}" required><small class="form-error" th:errors="*{sku}"></small></div>
        <div class="form-group"><label for="name">Product name</label><input class="form-control" id="name" th:field="*{name}" required><small class="form-error" th:errors="*{name}"></small></div>
        <div class="form-group"><label for="categoryId">Category</label><select class="form-control" id="categoryId" th:field="*{categoryId}" required><option value="">Choose category</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Category</option></select><small class="form-error" th:errors="*{categoryId}"></small></div>
        <div class="form-group"><label for="price">Price</label><input class="form-control" id="price" type="number" min="0.01" step="0.01" th:field="*{price}" required><small class="form-error" th:errors="*{price}"></small></div>
        <div class="form-group"><label for="stockQuantity">Stock quantity</label><input class="form-control" id="stockQuantity" type="number" min="0" th:field="*{stockQuantity}" required></div>
        <div class="form-group"><label for="imageUrl">Image URL</label><input class="form-control" id="imageUrl" type="url" th:field="*{imageUrl}" required><small class="form-error" th:errors="*{imageUrl}"></small></div>
        <div class="form-group"><label for="sustainabilityTags">Sustainability tags</label><input class="form-control" id="sustainabilityTags" th:field="*{sustainabilityTags}" placeholder="Reusable, Plastic-Free"></div>
        <div class="form-group"><label for="materialInfo">Materials</label><input class="form-control" id="materialInfo" th:field="*{materialInfo}"></div>
        <div class="form-group"><label for="packagingInfo">Packaging</label><input class="form-control" id="packagingInfo" th:field="*{packagingInfo}"></div>
        <div class="form-group"><label for="originCountry">Origin</label><input class="form-control" id="originCountry" th:field="*{originCountry}"></div>
    </div>
    <div class="form-group"><label for="description">Description</label><textarea class="form-control" id="description" rows="5" th:field="*{description}" required></textarea><small class="form-error" th:errors="*{description}"></small></div>
    <label><input type="checkbox" th:field="*{featured}"> Featured</label>
    <label style="margin-left:1rem"><input type="checkbox" th:field="*{active}"> Active</label>
    <div style="margin-top:1.5rem"><button class="btn btn-primary" type="submit">Save product</button><a class="btn btn-secondary" th:href="@{/admin/products}">Cancel</a></div>
</div></body></html>
