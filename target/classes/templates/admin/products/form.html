<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product form | EcoNest</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><div th:replace="~{fragments/layout :: header}"></div><main class="section"><div class="container" style="max-width:900px">
    <div th:replace="~{fragments/layout :: alerts}"></div><p><a th:href="@{/admin/products}">← Products</a></p><h1 class="section-title" th:text="${productForm.id == null ? 'Add product' : 'Edit product'}">Product</h1>
    <form class="form-card" th:if="${productForm.id == null}" th:action="@{/admin/products/new}" th:object="${productForm}" method="post"><div th:replace="~{admin/products/form-fields :: fields}"></div></form>
    <form class="form-card" th:if="${productForm.id != null}" th:action="@{/admin/products/{id}/edit(id=${productForm.id})}" th:object="${productForm}" method="post"><div th:replace="~{admin/products/form-fields :: fields}"></div></form>
</div></main><div th:replace="~{fragments/layout :: footer}"></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
