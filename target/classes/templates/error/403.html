<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied | EcoNest</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/layout :: header"></div>

<main class="container section">
    <div class="empty-state" style="max-width: 600px; margin: 3rem auto;">
        <div class="empty-state-icon" style="background-color: #fee2e2; color: #b91c1c;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="empty-state-title">Access Restricted</h1>
        <p class="empty-state-text">
            You do not have permission to access this protected area. If you believe this is in error, please sign in with an authorized administrator account.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a class="btn btn-primary" th:href="@{/}">Return Home</a>
            <a class="btn btn-secondary" th:href="@{/login}">Sign In</a>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>
<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
